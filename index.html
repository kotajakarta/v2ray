<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Config Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { transition: all 0.3s ease; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f1f5f9;
            font-size: 14px;
        }
        body.light {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            color: #0f172a;
        }
        .glass {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        body.light .glass {
            background: rgba(255,255,255,0.75);
            border: 1px solid rgba(0,0,0,0.1);
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            width: 260px;
            background: rgba(30,41,59,0.98);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 12px;
            z-index: 50;
        }
        body.light .dropdown-menu {
            background: rgba(255,255,255,0.98);
            border: 1px solid rgba(0,0,0,0.1);
        }
        .dropdown-menu.show { display: block; }
        .status-badge {
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
        }
        @media (max-width: 640px) {
            h1 { font-size: 1.75rem; }
            table { font-size: 12.5px; }
        }
    </style>
</head>
<body class="min-h-screen py-6 px-4">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-black bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">
                    VPN Config Manager
                </h1>
                <p class="text-slate-400">VMess • VLESS • Trojan • Shadowsocks</p>
            </div>
            <button id="themeToggle" class="w-12 h-12 rounded-2xl glass flex items-center justify-center text-2xl">
                <i class="fas fa-moon"></i>
            </button>
        </div>

        <!-- Info -->
        <div class="glass rounded-3xl p-6 mb-6">
            <div class="flex items-center gap-3 mb-4">
                <i class="fas fa-info-circle text-cyan-400"></i>
                <h2 class="font-bold">Cara Pakai</h2>
            </div>
            <p class="text-sm text-slate-300">
                1. Buka Worker Cloudflare kamu<br>
                2. Copy Host Worker (contoh: <span class="font-mono text-emerald-400" id="currentHost">yourworker.workers.dev</span>)<br>
                3. Gunakan path seperti <span class="font-mono text-cyan-400">/ID</span>, <span class="font-mono text-cyan-400">/SG</span>, atau <span class="font-mono text-cyan-400">/US</span>
            </p>
        </div>

        <!-- Search & Refresh -->
        <div class="flex gap-3 mb-6">
            <div class="relative flex-1">
                <input type="text" id="searchInput" placeholder="Cari negara atau ISP..." 
                       class="w-full bg-white/10 border border-white/20 rounded-2xl py-4 pl-12 focus:outline-none focus:border-blue-500">
                <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            </div>
            <button onclick="fetchProxies()" class="bg-blue-600 hover:bg-blue-700 px-8 rounded-2xl font-bold">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>

        <!-- Table -->
        <div class="glass rounded-3xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="border-b border-white/10 text-xs uppercase text-slate-400">
                            <th class="text-left py-5 px-6">Location</th>
                            <th class="text-left py-5 px-6 hidden md:table-cell">Provider</th>
                            <th class="text-center py-5 px-6">Status</th>
                            <th class="text-center py-5 px-6">Info</th>
                            <th class="text-right py-5 px-6">Config</th>
                        </tr>
                    </thead>
                    <tbody id="proxyTableBody" class="text-sm"></tbody>
                </table>
            </div>
        </div>

        <div class="text-center text-xs text-slate-500 mt-8">
            Deployed on GitHub Pages • Data from Proxy List
        </div>
    </div>

    <!-- Modal -->
    <div id="infoModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center z-50 p-4">
        <div class="glass rounded-3xl max-w-lg w-full max-h-[90vh] overflow-auto p-6" id="modalContent"></div>
    </div>

    <script>
        // Theme Toggle
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            document.getElementById('themeToggle').innerHTML = isLight ? 
                '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        });

        let allProxies = [];
        let filteredProxies = [];
        let currentPage = 1;

        const proxyListUrl = "https://raw.githubusercontent.com/FoolVPN-ID/Nautica/refs/heads/main/proxyList.txt";
        const CHECK_API_URL = "https://cprx-sshvless.wasmer.app/api/check";

        async function fetchProxies() {
            try {
                const res = await fetch(proxyListUrl);
                const text = await res.text();
                const lines = text.trim().split('\n');
                
                allProxies = lines.map(line => {
                    const [ip, port, country, isp] = line.split(',');
                    return {
                        ip, port, country: country || 'Unknown',
                        isp: isp || '-',
                        countryCode: country
                    };
                }).filter(p => p.ip && p.port);

                filteredProxies = [...allProxies];
                renderTable();
            } catch (e) {
                alert("Gagal mengambil daftar proxy");
            }
        }

        function renderTable() {
            const tbody = document.getElementById('proxyTableBody');
            tbody.innerHTML = '';

            filteredProxies.forEach((proxy, index) => {
                const row = `
                <tr class="border-b border-white/10 hover:bg-white/5">
                    <td class="py-4 px-6">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">${getFlag(proxy.countryCode)}</span>
                            <div>
                                <div class="font-semibold">${proxy.country}</div>
                                <div class="text-xs text-slate-400 font-mono">${proxy.ip}:${proxy.port}</div>
                            </div>
                        </div>
                    </td>
                    <td class="py-4 px-6 hidden md:table-cell">
                        <div class="text-sm">${proxy.isp}</div>
                    </td>
                    <td class="py-4 px-6 text-center">
                        <div class="status-badge bg-blue-500/20 text-blue-400">CHECK</div>
                    </td>
                    <td class="py-4 px-6 text-center">
                        <button onclick="showInfo(${index})" class="text-slate-400 hover:text-white">
                            <i class="fas fa-info-circle text-xl"></i>
                        </button>
                    </td>
                    <td class="py-4 px-6 text-right">
                        <button onclick="toggleDropdown(${index})" 
                                class="bg-blue-600 hover:bg-blue-700 px-5 py-2 rounded-xl text-sm font-semibold">
                            Config <i class="fas fa-chevron-down"></i>
                        </button>
                        <div id="drop-${index}" class="dropdown-menu">
                            <!-- Config buttons akan di-generate via JS -->
                        </div>
                    </td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function getFlag(code) {
            if (!code || code.length !== 2) return '🌐';
            return String.fromCodePoint(...code.toUpperCase().split('').map(c => 127397 + c.charCodeAt(0)));
        }

        function toggleDropdown(index) {
            document.querySelectorAll('.dropdown-menu').forEach(el => el.classList.remove('show'));
            document.getElementById(`drop-${index}`).classList.toggle('show');
        }

        function showInfo(index) {
            const proxy = filteredProxies[index];
            // Modal sederhana
            document.getElementById('modalContent').innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold">${proxy.country} - ${proxy.isp}</h3>
                    <button onclick="closeModal()" class="text-3xl leading-none">×</button>
                </div>
                <p><strong>IP:</strong> ${proxy.ip}:${proxy.port}</p>
                <div class="mt-6 flex gap-3">
                    <button onclick="copyText('${proxy.ip}:${proxy.port}')" 
                            class="flex-1 bg-white/10 hover:bg-white/20 py-3 rounded-2xl">Copy IP:Port</button>
                </div>
            `;
            document.getElementById('infoModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('infoModal').classList.add('hidden');
        }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            alert('✅ Copied: ' + text);
        }

        // Search
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            filteredProxies = allProxies.filter(p => 
                p.country.toLowerCase().includes(q) || 
                p.isp.toLowerCase().includes(q)
            );
            renderTable();
        });

        // Load data saat halaman dibuka
        fetchProxies();
    </script>
</body>
</html>
